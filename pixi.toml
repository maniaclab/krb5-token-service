[workspace]
name = "krb5-token-service"
version = "0.2.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
exclude-newer = "7d"

[dependencies]
python = ">=3.12,<3.13"

[feature.service.dependencies]
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = ">=2.7"
pydantic-settings = ">=2.3"
pyjwt = ">=2.8"
cryptography = ">=42"
httpx = ">=0.27"
structlog = ">=24.4"
# Provides kinit/klist/kdestroy. Like voms-token-service's `voms` package,
# krb5 is packaged on conda-forge, so no apt repo dance is needed in the
# Containerfile — the binary rides in the same pixi environment as the
# Python service.
krb5 = ">=1.21"
# Structured ccache reading (see src/krb5_token_service/ccache.py) —
# klist's own output is locale-dependent and therefore unparseable as a
# stable contract. Floor is 0.9 (not the newer 0.10) so the solver isn't
# forced onto whatever single python/platform build happens to have landed
# inside this workspace's exclude-newer window on a given day — 0.9's
# builds are all long past that window.
pykrb5 = ">=0.9"
# Required by the vendored etc/cern-get-keytab (CERN's own keytab-issuance
# tool — see etc/cern-get-keytab.patch) — it imports requests/yaml/urllib3
# directly. urllib3 rides in transitively with requests.
requests = ">=2.31"
pyyaml = ">=6.0"
# ca-certificates is pulled in transitively for httpx's JWKS TLS
# verification; no grid/IGTF trust bundle is needed here (unlike
# voms-token-service, this service verifies no X.509 chain of its own).

[feature.service.pypi-dependencies]
krb5-token-service = { path = ".", editable = true }

[feature.service.tasks]
serve = { cmd = "uvicorn krb5_token_service.app:app --host 0.0.0.0 --port 8080 --reload", description = "Run dev server at http://localhost:8080" }

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
anyio = ">=4.0"
ruff = ">=0.4"
mypy = ">=1.10"
pre-commit = ">=3.7"
tbump = ">=6.7.0"

# Each task name must be defined in exactly one feature: pixi resolves
# duplicate names across features nondeterministically.
[feature.dev.tasks]
lint = { cmd = "ruff check src tests && ruff format --check src tests", description = "Ruff lint + format check" }
fmt = { cmd = "ruff format src tests && ruff check --fix src tests", description = "Format and auto-fix source" }
typecheck = { cmd = "mypy src", description = "Type-check service source" }
pre-commit = { cmd = "pre-commit run --all-files", description = "Run pre-commit hooks on all files" }
lint-all = { depends-on = ["lint", "typecheck", "pre-commit"], description = "Everything the CI lint job runs" }
test = { cmd = "pytest tests/ -v", description = "Service tests" }
check = { depends-on = ["lint", "typecheck", "test"], description = "Quick check: lint + typecheck + tests" }

[environments]
service = { features = ["service"], solve-group = "default" }
dev = { features = ["service", "dev"], solve-group = "default" }
