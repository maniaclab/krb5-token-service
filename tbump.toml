github_url = "https://github.com/maniaclab/krb5-token-service"

[version]
current = "0.2.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (rc
    (?P<candidate>\d+)
  )?
  '''

[git]
message_template = "chore: bump version 0.2.0 → {new_version}"
tag_template = "v{new_version}"

[[file]]
src = "tbump.toml"
search = "bump version {current_version} → "

[[file]]
src = "pixi.toml"
# Match only the workspace-level version line, not dependency version constraints.
search = 'version = "{current_version}"'

[[file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[file]]
src = "src/krb5_token_service/app.py"
search = 'version="{current_version}"'

[[file]]
src = "charts/krb5-token-service/Chart.yaml"
search = 'appVersion: "{current_version}"'

[[file]]
src = "charts/krb5-token-service/Chart.yaml"
search = 'version: {current_version}'

[[field]]
name = "candidate"
default = ""
