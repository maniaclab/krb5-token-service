[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "krb5-token-service"
version = "0.2.0"
description = "Kerberos ticket minting for the UChicago ATLAS Analysis Facility MCP platform"
requires-python = ">=3.12"
# Dependencies are managed by pixi — see pixi.toml at the workspace root.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/krb5_token_service"]

[tool.ruff]
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
# Ruleset adapted from scientific-python/cookie (mirrors voms-token-service).
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "TRY003",  # Long exception messages inline — custom exception classes would be over-engineering
  "EM101",   # String literal in exception — assign-to-variable pattern adds noise, not clarity
  "EM102",   # f-string in exception — same rationale as EM101
  "ISC001",  # Conflicts with the ruff formatter (implicit string concatenation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["krb5_token_service"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# "." so test modules can import shared fixture helpers from tests.conftest.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
